<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Chowser Rust</title>
    <link rel="stylesheet" href="./styles.css" />
  </head>
  <body>
    <div class="background-blur"></div>
    <div class="app-shell">
      <aside class="sidebar">
        <div class="brand">
          <h1>Chowser Rust</h1>
          <p>Multiplatform Link Router</p>
        </div>
        <nav class="nav">
          <button class="tab active" data-tab="picker">Picker</button>
          <button class="tab" data-tab="browsers">Browsers</button>
          <button class="tab" data-tab="rules">Rules</button>
        </nav>
        <div class="sidebar-status" id="defaultStatusSummary"></div>
      </aside>

      <main class="content">
        <header class="topbar">
          <div>
            <div class="top-title">Route Links Intentionally</div>
            <div class="top-subtitle" id="configPathLine"></div>
          </div>
          <div class="top-actions">
            <button id="recheckDefaultBtn" class="button secondary">Recheck</button>
            <button id="setupDefaultBtn" class="button secondary">Set Default</button>
            <button id="reopenOnboardingBtn" class="button secondary">Onboarding</button>
          </div>
        </header>

        <section class="statusline" id="statusline"></section>

        <section id="panel-picker" class="panel visible"></section>
        <section id="panel-browsers" class="panel"></section>
        <section id="panel-rules" class="panel"></section>
      </main>
    </div>

    <div class="modal-backdrop" id="onboardingModal">
      <div class="modal">
        <h2>Onboarding</h2>
        <p class="subtitle">Configure imports and default browser checks before testing the picker.</p>

        <div class="checklist" id="defaultChecklist"></div>

        <div class="import-grid">
          <label>
            Browsers JSON path
            <input id="browsersPathInput" type="text" />
          </label>
          <button id="importBrowsersBtn" class="button secondary">Import Browsers</button>

          <label>
            Rules JSON path
            <input id="rulesPathInput" type="text" />
          </label>
          <button id="importRulesBtn" class="button secondary">Import Rules</button>
        </div>

        <div class="row-actions">
          <button id="detectBrowsersBtn" class="button secondary">Detect Browsers</button>
          <button id="openSetupBtn" class="button secondary">Set Default</button>
        </div>

        <div class="row-actions end">
          <button id="skipOnboardingBtn" class="button secondary">Skip</button>
          <button id="finishOnboardingBtn" class="button primary">Finish Setup</button>
        </div>
      </div>
    </div>

    <!-- Browser add/edit modal -->
    <div class="modal-backdrop" id="browserFormModal">
      <div class="modal form-modal">
        <h2 id="browserFormTitle">Add Browser</h2>
        <div class="form-grid">
          <label>Name <span class="req">*</span><input id="bf_name" type="text" placeholder="e.g. Chrome Work" /></label>
          <label>App ID / Bundle ID <span class="req">*</span><input id="bf_appId" type="text" placeholder="e.g. com.google.Chrome" /></label>
          <label>Executable<input id="bf_executable" type="text" placeholder="Leave blank for platform default" /></label>
          <label>Shortcut Key (1–9)<input id="bf_shortcut" type="text" placeholder="e.g. 2" maxlength="1" /></label>
          <label>Profile<input id="bf_profile" type="text" placeholder="e.g. Default (optional)" /></label>
          <label class="full">Custom Arguments<input id="bf_customArgs" type="text" placeholder="e.g. --incognito {url} (optional)" /></label>
        </div>
        <input type="hidden" id="bf_editId" />
        <div class="row-actions end">
          <button id="browserFormCancelBtn" class="button secondary">Cancel</button>
          <button id="browserFormSaveBtn" class="button primary">Save</button>
        </div>
      </div>
    </div>

    <!-- Rule add/edit modal -->
    <div class="modal-backdrop" id="ruleFormModal">
      <div class="modal form-modal">
        <h2 id="ruleFormTitle">Add Rule</h2>
        <div class="form-grid">
          <label>Name<input id="rf_name" type="text" placeholder="e.g. GitHub Work" /></label>
          <label>Host Pattern <span class="req">*</span><input id="rf_hostPattern" type="text" placeholder="e.g. github.com or *.example.com" /></label>
          <label>Path Prefix<input id="rf_pathPrefix" type="text" placeholder="e.g. /org (optional)" /></label>
          <label>Browser App ID <span class="req">*</span><input id="rf_browserAppId" type="text" placeholder="e.g. com.google.Chrome" /></label>
          <label>Profile<input id="rf_profile" type="text" placeholder="Profile name (optional)" /></label>
          <label>Source App ID<input id="rf_sourceAppId" type="text" placeholder="e.g. com.tinyspeck.slackmacgap (optional)" /></label>
          <label class="toggle-row"><input id="rf_privateMode" type="checkbox" /> Open in private / incognito mode</label>
          <label class="toggle-row"><input id="rf_isEnabled" type="checkbox" checked /> Rule is enabled</label>
        </div>
        <input type="hidden" id="rf_editId" />
        <div class="row-actions end">
          <button id="ruleFormCancelBtn" class="button secondary">Cancel</button>
          <button id="ruleFormSaveBtn" class="button primary">Save</button>
        </div>
      </div>
    </div>

    <!-- Quick-rule modal (picker mode: press R) -->
    <div class="modal-backdrop" id="quickRuleModal">
      <div class="modal form-modal">
        <h2>Create Rule for This URL</h2>
        <p class="subtitle" id="quickRuleUrlDisplay"></p>
        <div class="form-grid">
          <label>Rule Name<input id="qr_name" type="text" placeholder="e.g. GitHub Work" /></label>
          <label>Browser App ID <span class="req">*</span><input id="qr_browserAppId" type="text" /></label>
          <label>Profile<input id="qr_profile" type="text" placeholder="Profile name (optional)" /></label>
          <label class="toggle-row"><input id="qr_privateMode" type="checkbox" /> Open in private / incognito mode</label>
        </div>
        <div class="row-actions end">
          <button id="quickRuleCancelBtn" class="button secondary">Cancel</button>
          <button id="quickRuleSaveBtn" class="button primary">Create Rule</button>
        </div>
      </div>
    </div>

    <!-- Confirm delete dialog -->
    <div class="modal-backdrop" id="confirmModal">
      <div class="modal form-modal">
        <h2>Confirm Delete</h2>
        <p id="confirmMessage" class="subtitle"></p>
        <div class="row-actions end">
          <button id="confirmCancelBtn" class="button secondary">Cancel</button>
          <button id="confirmOkBtn" class="button danger">Delete</button>
        </div>
      </div>
    </div>

    <script src="./app.js"></script>
  </body>
</html>
