name: Deploy Docs to GitHub Pages

on:
  push:
    branches: ["main"]
    paths:
      - "docs/**"
      - "Chowser/HostedCatalogKeys.json"
      - "Chowser/HostedCatalogTrust.swift"
      - "Chowser/RewriteCatalogService.swift"
      - "Chowser/NativeAppDirectory*.swift"
      - "ChowserTests/*CatalogTests.swift"
      - "ChowserTests/NativeDeepLinkDirectoryTests.swift"
      - "scripts/catalog-signing.swift"
      - ".github/workflows/deploy-docs.yml"
  pull_request:
    paths:
      - "docs/**"
      - "Chowser/HostedCatalogKeys.json"
      - "Chowser/HostedCatalogTrust.swift"
      - "Chowser/RewriteCatalogService.swift"
      - "Chowser/NativeAppDirectory*.swift"
      - "ChowserTests/*CatalogTests.swift"
      - "ChowserTests/NativeDeepLinkDirectoryTests.swift"
      - "scripts/catalog-signing.swift"
      - ".github/workflows/deploy-docs.yml"
  # Allows you to run this workflow manually from the Actions tab
  workflow_dispatch:

# Sets permissions of the GITHUB_TOKEN to allow deployment to GitHub Pages
permissions:
  contents: read
  pages: write
  id-token: write

# Allow only one concurrent deployment, skipping runs queued between the run in-progress and latest queued.
# However, do NOT cancel in-progress runs as we want to allow these production deployments to complete.
concurrency:
  group: "pages-${{ github.ref }}"
  cancel-in-progress: false

jobs:
  verify-catalogs:
    name: Verify signed catalogs
    runs-on: macos-15
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Select Xcode
        uses: maxim-lobanov/setup-xcode@v1
        with:
          xcode-version: "26.3"

      - name: Verify detached signatures
        run: |
          scripts/catalog-signing.swift verify \
            --keyring Chowser/HostedCatalogKeys.json \
            --catalog docs/public/rewrite-catalog.json \
            --signature docs/public/rewrite-catalog.sig.json
          scripts/catalog-signing.swift verify \
            --keyring Chowser/HostedCatalogKeys.json \
            --catalog docs/public/native-app-directory.json \
            --signature docs/public/native-app-directory.sig.json

      - name: Validate catalog semantics with the app trust boundary
        run: |
          xcodebuild test \
            -project Chowser.xcodeproj \
            -scheme Chowser-osp \
            -destination 'platform=macOS' \
            -derivedDataPath "$RUNNER_TEMP/catalog-tests" \
            -only-testing:ChowserTests/RewriteCatalogTests \
            -only-testing:ChowserTests/NativeDeepLinkDirectoryTests \
            CODE_SIGNING_ALLOWED=NO

  build:
    name: Build React App
    needs: verify-catalogs
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: docs
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Bun
        uses: oven-sh/setup-bun@v1
        with:
          bun-version: latest

      - name: Install dependencies
        run: bun install

      - name: Build with Vite
        run: bun run build

      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: docs/dist

  deploy:
    name: Deploy to GitHub Pages
    if: github.event_name != 'pull_request' && (github.ref == 'refs/heads/main' || github.event_name == 'workflow_dispatch')
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    needs: build
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
