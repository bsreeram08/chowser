<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Chowser Settings</title>
    <style>
      * {
        box-sizing: border-box;
        margin: 0;
        padding: 0;
      }

      :root {
        --bg: #1e1e1e;
        --sidebar-bg: #161616;
        --surface: rgba(255, 255, 255, 0.06);
        --surface-hover: rgba(255, 255, 255, 0.1);
        --surface-active: rgba(255, 255, 255, 0.16);
        --border: rgba(255, 255, 255, 0.08);
        --text: #e8e8e8;
        --text-secondary: rgba(232, 232, 232, 0.5);
        --accent: #0a84ff;
        --destructive: #ff453a;
        --success: #30d158;
        --radius: 10px;
        --radius-sm: 6px;
      }

      html,
      body {
        height: 100%;
        font-family: -apple-system, "SF Pro Text", BlinkMacSystemFont,
          "Segoe UI", sans-serif;
        background: var(--bg);
        color: var(--text);
        overflow: hidden;
        font-size: 13px;
      }

      /* Layout */
      .layout {
        display: flex;
        height: 100%;
      }

      /* Sidebar */
      .sidebar {
        width: 200px;
        background: var(--sidebar-bg);
        border-right: 1px solid var(--border);
        display: flex;
        flex-direction: column;
        padding: 12px 8px;
        gap: 2px;
        flex-shrink: 0;
      }

      .sidebar-item {
        display: flex;
        align-items: center;
        gap: 8px;
        padding: 7px 10px;
        border-radius: var(--radius-sm);
        cursor: pointer;
        color: var(--text-secondary);
        transition: background 0.1s, color 0.1s;
        font-size: 13px;
      }

      .sidebar-item:hover {
        background: var(--surface);
        color: var(--text);
      }

      .sidebar-item.active {
        background: var(--surface-active);
        color: var(--text);
      }

      .sidebar-icon {
        font-size: 15px;
        width: 20px;
        text-align: center;
      }

      /* Main content area */
      .content {
        flex: 1;
        overflow-y: auto;
        padding: 24px;
      }

      .tab-panel {
        display: none;
      }

      .tab-panel.active {
        display: block;
      }

      h2 {
        font-size: 17px;
        font-weight: 600;
        margin-bottom: 18px;
      }

      h3 {
        font-size: 14px;
        font-weight: 600;
        margin-bottom: 10px;
        color: var(--text-secondary);
        text-transform: uppercase;
        letter-spacing: 0.05em;
      }

      /* Cards / list items */
      .card {
        background: var(--surface);
        border-radius: var(--radius);
        overflow: hidden;
        margin-bottom: 16px;
      }

      .list-item {
        display: flex;
        align-items: center;
        gap: 10px;
        padding: 11px 14px;
        border-bottom: 1px solid var(--border);
        min-height: 48px;
      }

      .list-item:last-child {
        border-bottom: none;
      }

      .list-item-icon {
        font-size: 22px;
        flex-shrink: 0;
        width: 32px;
        text-align: center;
      }

      .list-item-body {
        flex: 1;
        min-width: 0;
      }

      .list-item-title {
        font-size: 13.5px;
        font-weight: 500;
        overflow: hidden;
        text-overflow: ellipsis;
        white-space: nowrap;
      }

      .list-item-subtitle {
        font-size: 11.5px;
        color: var(--text-secondary);
        overflow: hidden;
        text-overflow: ellipsis;
        white-space: nowrap;
      }

      .list-item-actions {
        display: flex;
        gap: 6px;
        flex-shrink: 0;
      }

      /* Buttons */
      .btn {
        font-size: 12.5px;
        padding: 5px 12px;
        border-radius: var(--radius-sm);
        cursor: pointer;
        border: none;
        transition: opacity 0.1s;
        font-family: inherit;
      }

      .btn:hover {
        opacity: 0.85;
      }

      .btn-primary {
        background: var(--accent);
        color: white;
      }

      .btn-ghost {
        background: var(--surface-hover);
        color: var(--text);
      }

      .btn-danger {
        background: transparent;
        color: var(--destructive);
      }

      .btn-danger:hover {
        background: rgba(255, 69, 58, 0.15);
        opacity: 1;
      }

      .btn-sm {
        padding: 3px 9px;
        font-size: 12px;
      }

      /* Section header with action */
      .section-header {
        display: flex;
        align-items: center;
        justify-content: space-between;
        margin-bottom: 10px;
      }

      /* Toggle switch */
      .toggle-row {
        display: flex;
        align-items: center;
        justify-content: space-between;
        padding: 10px 14px;
        border-bottom: 1px solid var(--border);
      }

      .toggle-row:last-child {
        border-bottom: none;
      }

      .toggle-label {
        display: flex;
        flex-direction: column;
        gap: 2px;
      }

      .toggle-switch {
        position: relative;
        width: 36px;
        height: 20px;
        cursor: pointer;
        flex-shrink: 0;
      }

      .toggle-switch input {
        opacity: 0;
        width: 0;
        height: 0;
      }

      .toggle-track {
        position: absolute;
        inset: 0;
        background: rgba(255, 255, 255, 0.15);
        border-radius: 10px;
        transition: background 0.2s;
      }

      .toggle-switch input:checked + .toggle-track {
        background: var(--accent);
      }

      .toggle-track::after {
        content: "";
        position: absolute;
        width: 16px;
        height: 16px;
        background: white;
        border-radius: 50%;
        top: 2px;
        left: 2px;
        transition: transform 0.2s;
      }

      .toggle-switch input:checked + .toggle-track::after {
        transform: translateX(16px);
      }

      /* Form inputs */
      input[type="text"],
      input[type="url"],
      select,
      textarea {
        background: var(--surface);
        border: 1px solid var(--border);
        border-radius: var(--radius-sm);
        color: var(--text);
        font-size: 13px;
        padding: 7px 10px;
        outline: none;
        font-family: inherit;
        width: 100%;
        transition: border-color 0.15s;
      }

      input[type="text"]:focus,
      input[type="url"]:focus,
      select:focus,
      textarea:focus {
        border-color: var(--accent);
      }

      select option {
        background: #2a2a2a;
      }

      /* Tags */
      .tag {
        display: inline-block;
        font-size: 10.5px;
        padding: 2px 7px;
        border-radius: 4px;
        background: var(--surface-hover);
        color: var(--text-secondary);
      }

      .tag.enabled {
        background: rgba(48, 209, 88, 0.15);
        color: var(--success);
      }

      .tag.disabled {
        background: rgba(255, 69, 58, 0.1);
        color: var(--destructive);
      }

      /* Onboarding banner */
      .onboarding-banner {
        background: linear-gradient(
          135deg,
          rgba(10, 132, 255, 0.15),
          rgba(10, 132, 255, 0.05)
        );
        border: 1px solid rgba(10, 132, 255, 0.25);
        border-radius: var(--radius);
        padding: 16px;
        margin-bottom: 20px;
        display: flex;
        align-items: flex-start;
        gap: 12px;
      }

      .onboarding-banner-icon {
        font-size: 28px;
        flex-shrink: 0;
      }

      .onboarding-banner-body {
        flex: 1;
      }

      .onboarding-banner h3 {
        font-size: 14px;
        font-weight: 600;
        color: var(--text);
        text-transform: none;
        letter-spacing: 0;
        margin-bottom: 4px;
      }

      .onboarding-banner p {
        font-size: 12.5px;
        color: var(--text-secondary);
        margin-bottom: 10px;
      }

      /* Empty state */
      .empty-state {
        display: flex;
        flex-direction: column;
        align-items: center;
        gap: 8px;
        padding: 40px 20px;
        color: var(--text-secondary);
      }

      .empty-state-icon {
        font-size: 36px;
        opacity: 0.5;
      }

      /* Textarea for import/export */
      textarea {
        resize: vertical;
        min-height: 200px;
        font-family: "SF Mono", Menlo, monospace;
        font-size: 11.5px;
      }

      /* Loading */
      .loading {
        display: flex;
        align-items: center;
        justify-content: center;
        height: 200px;
        color: var(--text-secondary);
      }

      /* Modal overlay */
      .modal-overlay {
        position: fixed;
        inset: 0;
        background: rgba(0, 0, 0, 0.6);
        display: flex;
        align-items: center;
        justify-content: center;
        z-index: 100;
        backdrop-filter: blur(4px);
      }

      .modal {
        background: #2a2a2a;
        border-radius: var(--radius);
        padding: 20px;
        width: 420px;
        max-width: 90vw;
      }

      .modal h3 {
        font-size: 15px;
        font-weight: 600;
        color: var(--text);
        text-transform: none;
        letter-spacing: 0;
        margin-bottom: 14px;
      }

      .modal-actions {
        display: flex;
        justify-content: flex-end;
        gap: 8px;
        margin-top: 16px;
      }

      .form-group {
        margin-bottom: 12px;
      }

      .form-label {
        display: block;
        font-size: 12px;
        color: var(--text-secondary);
        margin-bottom: 4px;
      }

      /* Rule priority badge */
      .rule-priority {
        font-size: 10px;
        color: var(--text-secondary);
        background: var(--surface);
        padding: 2px 6px;
        border-radius: 4px;
        flex-shrink: 0;
      }
    </style>
  </head>
  <body>
    <div id="root">
      <div class="loading">Loading settings…</div>
    </div>
    <script src="./index.js" type="module"></script>
  </body>
</html>
