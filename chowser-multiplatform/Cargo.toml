[package]
name = "chowser-multiplatform"
version = "0.1.0"
edition = "2021"
description = "Cross-platform browser chooser for Windows, Linux, and macOS testing"
license = "MIT"
build = "build.rs"

[package.metadata.bundle]
name = "Chowser Rust"
identifier = "in.sreerams.chowser-test"
short_description = "Cross-platform browser chooser"
category = "public.app-category.utilities"

[dependencies]
anyhow = "1.0"
directories = "5.0"
plist = "1.7"
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
shlex = "1.3"
tauri = { version = "2.0", features = ["tray-icon", "image-png"] }
tauri-plugin-autostart = "2.0"
tauri-plugin-clipboard-manager = "2.0"
url = "2.5"
uuid = { version = "1.8", features = ["serde", "v4"] }
which = "6.0"

[target.'cfg(windows)'.dependencies]
winreg = "0.52"

[target.'cfg(target_os = "macos")'.dependencies]
cocoa = "0.25"
core-foundation = "0.10"
objc = "0.2"

[build-dependencies]
tauri-build = { version = "2.0", features = [] }

[dev-dependencies]
pretty_assertions = "1.4"
