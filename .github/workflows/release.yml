name: Release (Direct Download)

on:
  push:
    tags:
      - 'v*'

permissions:
  contents: write
  pages: write

jobs:
  build-and-release:
    runs-on: macos-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup Xcode
        uses: maxim-lobanov/setup-xcode@v1
        with:
          xcode-version: latest-stable

      - name: Resolve Swift packages
        run: xcodebuild -resolvePackageDependencies -project Chowser.xcodeproj -scheme Chowser

      - name: Extract version from tag
        id: version
        run: echo "VERSION=${GITHUB_REF_NAME#v}" >> "$GITHUB_OUTPUT"

      - name: Import signing certificate
        if: ${{ env.APPLE_CERTIFICATE_P12 != '' }}
        env:
          APPLE_CERTIFICATE_P12: ${{ secrets.APPLE_CERTIFICATE_P12 }}
          APPLE_CERTIFICATE_PASSWORD: ${{ secrets.APPLE_CERTIFICATE_PASSWORD }}
        run: |
          # Create a temporary keychain
          KEYCHAIN_PATH="$RUNNER_TEMP/signing.keychain-db"
          KEYCHAIN_PASSWORD="$(openssl rand -base64 32)"

          security create-keychain -p "$KEYCHAIN_PASSWORD" "$KEYCHAIN_PATH"
          security set-keychain-settings -lut 21600 "$KEYCHAIN_PATH"
          security unlock-keychain -p "$KEYCHAIN_PASSWORD" "$KEYCHAIN_PATH"

          # Import certificate
          CERT_PATH="$RUNNER_TEMP/certificate.p12"
          echo "$APPLE_CERTIFICATE_P12" | base64 --decode > "$CERT_PATH"

          security import "$CERT_PATH" \
            -k "$KEYCHAIN_PATH" \
            -P "$APPLE_CERTIFICATE_PASSWORD" \
            -T /usr/bin/codesign \
            -T /usr/bin/security

          security set-key-partition-list -S apple-tool:,apple: -k "$KEYCHAIN_PASSWORD" "$KEYCHAIN_PATH"
          security list-keychains -d user -s "$KEYCHAIN_PATH" login.keychain-db

          rm -f "$CERT_PATH"

      - name: Build and create DMG
        run: |
          chmod +x scripts/release.sh
          scripts/release.sh "${{ steps.version.outputs.VERSION }}"
        env:
          # Use Developer ID signing when certificate is available, otherwise unsigned
          CODE_SIGN_IDENTITY: ${{ secrets.APPLE_CERTIFICATE_P12 != '' && 'Developer ID Application' || '-' }}
          CODE_SIGNING_ALLOWED: ${{ secrets.APPLE_CERTIFICATE_P12 != '' && 'YES' || 'NO' }}
          NOTARIZE: ${{ secrets.APPLE_ID != '' && 'YES' || 'NO' }}
          APPLE_ID: ${{ secrets.APPLE_ID }}
          APPLE_ID_PASSWORD: ${{ secrets.APPLE_ID_PASSWORD }}
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
          SPARKLE_PRIVATE_KEY: ${{ secrets.SPARKLE_PRIVATE_KEY }}
          SPARKLE_DOWNLOAD_URL: "https://github.com/bsreeram08/chowser/releases/download/v${{ steps.version.outputs.VERSION }}/Chowser-${{ steps.version.outputs.VERSION }}.dmg"

      - name: Verify DMG
        run: |
          ls -lh release/
          test -f "release/Chowser-${{ steps.version.outputs.VERSION }}.dmg"

      - name: Update appcast
        if: ${{ secrets.SPARKLE_PRIVATE_KEY != '' }}
        run: |
          VERSION="${{ steps.version.outputs.VERSION }}"
          APPCAST_ITEM="release/appcast-item.xml"

          if [ ! -f "$APPCAST_ITEM" ]; then
            echo "No appcast item generated, skipping"
            exit 0
          fi

          # Determine which appcast file to update
          if [[ "$VERSION" == *"-beta"* ]]; then
            APPCAST_FILE="docs/public/appcast-beta.xml"
          else
            APPCAST_FILE="docs/public/appcast.xml"
          fi

          # Create appcast file if it doesn't exist
          if [ ! -f "$APPCAST_FILE" ]; then
            mkdir -p "$(dirname "$APPCAST_FILE")"
            cat > "$APPCAST_FILE" <<'EOF'
          <?xml version="1.0" encoding="utf-8"?>
          <rss version="2.0" xmlns:sparkle="http://www.andymatuschak.net/xml-namespaces/sparkle" xmlns:dc="http://purl.org/dc/elements/1.1/">
              <channel>
                  <title>Chowser Updates</title>
                  <link>https://chowser.sreerams.in/appcast.xml</link>
                  <description>Chowser app updates</description>
                  <language>en</language>
              </channel>
          </rss>
          EOF
          fi

          # Insert the new item before </channel>
          ITEM_CONTENT=$(cat "$APPCAST_ITEM")
          sed -i '' "s|</channel>|${ITEM_CONTENT}\n    </channel>|" "$APPCAST_FILE"

          # Commit the updated appcast back to the repo
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add "$APPCAST_FILE"
          git commit -m "chore: update appcast for v${VERSION}" || true
          git push origin HEAD:main || true

      - name: Determine if prerelease
        id: prerelease
        run: |
          VERSION="${{ steps.version.outputs.VERSION }}"
          if [[ "$VERSION" == *"-beta"* ]]; then
            echo "IS_PRERELEASE=true" >> "$GITHUB_OUTPUT"
          else
            echo "IS_PRERELEASE=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          name: "Chowser v${{ steps.version.outputs.VERSION }}"
          body: |
            ## Chowser v${{ steps.version.outputs.VERSION }}

            A lightweight macOS browser chooser with **profiles support**, **smart routing rules**, and **rule portability**. Intercept links anywhere and open them in the right browser, every time.

            ### What's New
            See [CHANGELOG](https://github.com/bsreeram08/chowser/blob/main/CHANGELOG.md) for details.

            ### Installation
            1. Download `Chowser-${{ steps.version.outputs.VERSION }}.dmg` below
            2. Open the DMG and drag Chowser to Applications
            3. Launch Chowser — it appears in the menu bar
            4. Click the menu bar icon → **Set as Default Browser**

            ### Auto-Updates
            Existing users will be notified automatically. You can also check manually via the menu bar → **Check for Updates…**

            > **Also available on the [Mac App Store](https://apps.apple.com/app/chowser/id_PLACEHOLDER)** (sandboxed version without browser profile support).

            [Setup Guide & AI-Powered Configuration](https://chowser.sreerams.in)
          files: release/Chowser-${{ steps.version.outputs.VERSION }}.dmg
          draft: false
          prerelease: ${{ steps.prerelease.outputs.IS_PRERELEASE }}

      - name: Cleanup keychain
        if: always()
        run: |
          KEYCHAIN_PATH="$RUNNER_TEMP/signing.keychain-db"
          if [ -f "$KEYCHAIN_PATH" ]; then
            security delete-keychain "$KEYCHAIN_PATH"
          fi
