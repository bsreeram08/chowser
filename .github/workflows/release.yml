name: Release

on:
  push:
    tags:
      - 'v*'

permissions:
  contents: write

jobs:
  build-and-release:
    runs-on: macos-latest
    
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Xcode
        uses: maxim-lobanov/setup-xcode@v1
        with:
          xcode-version: latest-stable

      - name: Extract version from tag
        id: version
        run: echo "VERSION=${GITHUB_REF_NAME#v}" >> "$GITHUB_OUTPUT"

      - name: Build and create DMG
        run: |
          chmod +x scripts/release.sh
          scripts/release.sh "${{ steps.version.outputs.VERSION }}"
        env:
          # Override signing for CI (unsigned build)
          CODE_SIGN_IDENTITY: "-"
          CODE_SIGNING_ALLOWED: "NO"

      - name: Verify DMG
        run: |
          ls -lh release/
          test -f "release/Chowser-${{ steps.version.outputs.VERSION }}.dmg"

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          name: "Chowser v${{ steps.version.outputs.VERSION }}"
          body: |
            ## Chowser v${{ steps.version.outputs.VERSION }}
            
            A lightweight macOS browser chooser with **profiles support**, **smart routing rules**, and **rule portability**. Intercept links anywhere and open them in the right browser, every time.
            
            ### Installation
            1. Download `Chowser-${{ steps.version.outputs.VERSION }}.dmg` below
            2. Open the DMG and drag Chowser to Applications
            3. Launch Chowser — it appears in the menu bar
            4. Right-click → Open if macOS shows a security warning (first launch only)
            5. Click the menu bar icon → **Set as Default Browser**
            
            > **Note**: This build is unsigned. On first launch, right-click → Open to bypass Gatekeeper.
            
            📖 **[Setup Guide & AI-Powered Configuration →](https://chowser.sreerams.in)**
          files: release/Chowser-${{ steps.version.outputs.VERSION }}.dmg
          draft: false
          prerelease: false
